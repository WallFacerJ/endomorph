title: Windows Security Event Log Cleared
id: endomorph-sigma-0002
status: stable
description: Detects the Security event log being cleared with wevtutil.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains: ' cl '
  condition: selection
level: high
tags:
  - attack.defense_evasion
  - attack.t1070.001
