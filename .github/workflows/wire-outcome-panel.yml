name: Wire outcome panel

on:
  push:
    branches:
      - feat/scenario-objectives-outcomes

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/scenario-objectives-outcomes

      - name: Wire outcome panel into investigation
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/App.tsx")
          text = path.read_text()
          original = text

          import_block = '''import {
            ScenarioOutcomePanel,
          } from "./ScenarioOutcomePanel";
          '''

          if 'from "./ScenarioOutcomePanel"' not in text:
              text = text.replace(
                  'import "./App.css";\n',
                  'import "./App.css";\n\n' + import_block,
                  1,
              )

          panel = '''            <ScenarioOutcomePanel
                        outcome={scenarioState.outcome}
                      />

          '''

          if 'outcome={scenarioState.outcome}' not in text:
              marker = '            <div className="summary-grid">'
              if marker not in text:
                  raise SystemExit("summary-grid marker not found")
              text = text.replace(marker, panel + marker, 1)

          if text != original:
              path.write_text(text)

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/App.tsx; then
            echo "Outcome panel is already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/App.tsx
          git commit -m "feat: show scenario outcome progress"
          git push origin HEAD:feat/scenario-objectives-outcomes
