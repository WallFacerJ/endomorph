name: Publish Polymorph v1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish v1.0.0 if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to publish."
            exit 0
          fi

          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "Polymorph v1.0.0" \
            --notes-file CHANGELOG.md
