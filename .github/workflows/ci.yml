name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      # Detection rules are code and regress like code. Editing a rule to
      # catch one technique routinely stops it catching another, and nothing
      # surfaces that until an incident is missed. The corpus is generated
      # from a fixed seed, so this comparison is exact and any difference is
      # attributable to a rule change.
      - name: Detection regression
        run: pnpm evaluate -- --baseline rules/detection-baseline.json

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e
