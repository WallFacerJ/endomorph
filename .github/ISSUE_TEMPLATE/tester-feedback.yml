name: Polymorph tester feedback
description: Share a first-time impression, usability problem, or reproducible bug.
title: "tester feedback: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Polymorph. Short feedback is useful. Please do not include real credentials, secrets, personal information, or production incident data.

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome on Windows 11"
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: Scenario tested
      options:
        - Finance account compromise
        - HR malware beacon
        - Cloud-admin compromise
        - Multiple scenarios
    validations:
      required: true

  - type: dropdown
    id: experience
    attributes:
      label: Cybersecurity experience
      options:
        - None
        - Some / student
        - Professional

  - type: textarea
    id: impression
    attributes:
      label: What did you think you were supposed to do, and where did you get confused?
      description: A few sentences is enough.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Did the final result and score make sense?
      description: Mention anything unclear about objectives, penalties, or submission.

  - type: dropdown
    id: style
    attributes:
      label: Which interface style did you prefer?
      options:
        - Midnight SOC
        - Graphite
        - No preference
        - I only tried one

  - type: textarea
    id: bug
    attributes:
      label: Anything broken or unexpected?
      description: If useful, include what you did, what you expected, and what happened instead.

  - type: textarea
    id: one-change
    attributes:
      label: What is the one change that would most improve the experience?
    validations:
      required: true
